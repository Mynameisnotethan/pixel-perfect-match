# Builds the two Lockbox server images and publishes them to GitHub Packages (ghcr.io).
# Images contain no provider credentials; each operator adds their own in post-deploy Setup.
name: Docker images
on:
  push: { branches: [main], tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: lockbox-mail, file: Dockerfile }
          - { name: lockbox-web, file: Dockerfile.web }
          - { name: lockbox-proxy, file: Dockerfile.proxy }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
