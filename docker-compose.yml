# Lockbox behind the existing Hostinger Traefik instance (host network mode).
# Traefik terminates HTTPS. Neither service publishes a host port.
services:
  web:
    image: ghcr.io/${LOCKBOX_IMAGE_ORG:-mynameisnotethan}/lockbox-web:${LOCKBOX_IMAGE_TAG:-latest}
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.lockbox-web.rule: 'Host(`${LOCKBOX_DOMAIN:-srv1790211.hstgr.cloud}`)'
      traefik.http.routers.lockbox-web.entrypoints: websecure
      traefik.http.routers.lockbox-web.tls.certresolver: ${LOCKBOX_TLS_RESOLVER:-letsencrypt}
      traefik.http.routers.lockbox-web.service: lockbox-web
      traefik.http.services.lockbox-web.loadbalancer.server.port: "3000"
  mail:
    image: ghcr.io/${LOCKBOX_IMAGE_ORG:-mynameisnotethan}/lockbox-mail:${LOCKBOX_IMAGE_TAG:-latest}
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.lockbox-mail.rule: 'Host(`${LOCKBOX_DOMAIN:-srv1790211.hstgr.cloud}`) && (PathPrefix(`/oauth/`) || Path(`/api/mailboxes`) || PathPrefix(`/api/mailboxes/`) || PathPrefix(`/api/admin/`) || PathPrefix(`/api/auth/`) || PathPrefix(`/api/ai/`))'
      traefik.http.routers.lockbox-mail.entrypoints: websecure
      traefik.http.routers.lockbox-mail.tls.certresolver: ${LOCKBOX_TLS_RESOLVER:-letsencrypt}
      traefik.http.routers.lockbox-mail.service: lockbox-mail
      traefik.http.services.lockbox-mail.loadbalancer.server.port: "3000"
    environment:
      # Used only as the default public address; the Setup page can still override it.
      LOCKBOX_DOMAIN: ${LOCKBOX_DOMAIN:-srv1790211.hstgr.cloud}
      LOCKBOX_PUBLIC_URL: ${LOCKBOX_PUBLIC_URL:-}
      LOCKBOX_TOKEN_KEY: ${LOCKBOX_TOKEN_KEY:-}            # optional: auto-generated on the data volume
      # Optional overrides; normally every provider credential is entered in post-deploy Setup.
      LOCKBOX_MS_DEVICE_CLIENT_ID: ${LOCKBOX_MS_DEVICE_CLIENT_ID:-}
      LOCKBOX_GOOGLE_CLIENT_ID: ${LOCKBOX_GOOGLE_CLIENT_ID:-}
      LOCKBOX_GOOGLE_CLIENT_SECRET: ${LOCKBOX_GOOGLE_CLIENT_SECRET:-}
      LOCKBOX_MS_CLIENT_ID: ${LOCKBOX_MS_CLIENT_ID:-}
      LOCKBOX_MS_CLIENT_SECRET: ${LOCKBOX_MS_CLIENT_SECRET:-}
    volumes:
      - lockbox-data:/data        # encrypted mailbox tokens, accounts, sessions + key; survives restarts and updates
volumes:
  lockbox-data:
