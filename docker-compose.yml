# Lockbox self-hosted stack: Caddy (HTTPS + login) -> web app + mail server.
# Setup: docs/HOSTINGER_DEPLOY.md
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    env_file: .env.lockbox
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data          # HTTPS certificates
    depends_on: [web, mail]
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    restart: unless-stopped
  mail:
    build: .
    restart: unless-stopped
    env_file: .env.lockbox        # never commit this file
    environment:
      LOCKBOX_USER_HEADER: x-lockbox-user   # set only by Caddy after login
    volumes:
      - lockbox-data:/data        # encrypted mailbox tokens; survives restarts and updates
volumes:
  caddy-data:
  lockbox-data:
